<div style="background:#F1F5F9;padding:32px 16px;font-family:Inter,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;">
    <tr><td style="height:8px;background:#006C49;font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr><td style="padding:32px 32px 8px;font-size:24px;font-weight:700;color:#0B1C30;">Puyer</td></tr>
    <tr><td style="padding:8px 32px 0;font-size:22px;font-weight:600;color:#0B1C30;">Sign in to Puyer</td></tr>
    <tr>
      <td style="padding:16px 32px 32px;font-size:14px;line-height:22px;color:#45464D;">
        <p>Use the button below to open your workspace. The link expires in one hour.</p>
        <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;background:#006C49;color:#F8F9FF;text-decoration:none;border-radius:8px;font-weight:600;">Sign in to Puyer</a></p>
        <p>Or enter this one-time code:</p>
        <p style="padding:16px;text-align:center;letter-spacing:4px;font-size:20px;color:#0B1C30;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:8px;">{{ .Token }}</p>
        <p>If you did not request this, you can ignore this email.</p>
      </td>
    </tr>
  </table>
</div>
