<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" role="img" aria-labelledby="loginHeroTitle">
  <title id="loginHeroTitle">Invoice sent and paid through your own Stripe account</title>
  <rect width="640" height="640" rx="48" fill="#0B1C30"/>
  <circle cx="520" cy="120" r="160" fill="#006C49" fill-opacity="0.22"/>
  <circle cx="96" cy="520" r="140" fill="#6FFBBE" fill-opacity="0.12"/>
  <circle cx="560" cy="500" r="72" fill="#006C49" fill-opacity="0.35"/>

  <!-- Abstract person -->
  <circle cx="168" cy="268" r="36" fill="#6FFBBE"/>
  <path d="M108 392c8-52 32-76 60-76s52 24 60 76" fill="#F8F9FF"/>
  <rect x="128" y="392" width="80" height="88" rx="16" fill="#F8F9FF"/>
  <rect x="148" y="428" width="40" height="28" rx="6" fill="#0B1C30"/>

  <!-- Invoice card -->
  <g transform="rotate(-8 360 300)">
    <rect x="248" y="156" width="280" height="360" rx="24" fill="#F8F9FF"/>
    <rect x="248" y="156" width="280" height="56" rx="24" fill="#006C49"/>
    <rect x="248" y="188" width="280" height="24" fill="#006C49"/>
    <rect x="280" y="240" width="160" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="280" y="268" width="216" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="280" y="296" width="188" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="280" y="348" width="216" height="2" fill="#E2E8F0"/>
    <rect x="280" y="376" width="96" height="10" rx="5" fill="#94A3B8"/>
    <rect x="424" y="372" width="72" height="16" rx="8" fill="#0B1C30"/>
    <rect x="280" y="420" width="120" height="40" rx="12" fill="#006C49"/>
  </g>

  <!-- Paid badge -->
  <circle cx="468" cy="428" r="44" fill="#6FFBBE"/>
  <path d="M448 428l12 12 24-28" stroke="#0B1C30" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coins to connected account -->
  <circle cx="214" cy="508" r="28" fill="#006C49"/>
  <circle cx="214" cy="508" r="16" fill="#6FFBBE"/>
  <circle cx="262" cy="536" r="20" fill="#6FFBBE"/>
  <rect x="300" y="520" width="88" height="56" rx="12" fill="#F8F9FF"/>
  <rect x="312" y="532" width="64" height="8" rx="4" fill="#006C49"/>
  <rect x="312" y="548" width="40" height="8" rx="4" fill="#E2E8F0"/>
</svg>
