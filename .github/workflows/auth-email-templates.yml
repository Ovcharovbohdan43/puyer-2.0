name: Auth email templates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/templates/**
      - scripts/push-auth-email-templates.mjs
      - lib/email/hosted-auth-templates.ts

jobs:
  push-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Push hosted Auth templates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is not set; skip hosted template push."
            exit 0
          fi
          npm run auth:push-templates
